<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10131b">
  <meta name="robots" content="noindex">
  <title>UNBLOCKED Proxy</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="browser">
    <div class="browser__top">
      <a class="brand" href="/" aria-label="Proxy home">
        <span class="brand__mark" aria-hidden="true">U</span>
        <span class="brand__name">UNBLOCKED<span>PROXY</span></span>
      </a>
      <div class="browser__hint">SCRAMJET ENGINE</div>
    </div>

    <div class="toolbar">
      <div class="toolbar__controls" aria-label="Browser controls">
        <button class="icon-button" id="back" type="button" aria-label="Back" title="Back" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button class="icon-button" id="forward" type="button" aria-label="Forward" title="Forward" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <button class="icon-button" id="reload" type="button" aria-label="Reload" title="Reload" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9a7 7 0 0 1 11.6-2L20 12M4 12l2.8 5a7 7 0 0 0 11.6-2"/></svg>
        </button>
      </div>

      <form id="omnibox" class="omnibox" role="search">
        <span class="omnibox__secure" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/></svg>
        </span>
        <input id="address" type="text" name="address" placeholder="Search or enter a website address" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" aria-label="Search or enter address">
        <button id="go" class="go-button" type="submit">Go <span aria-hidden="true">↵</span></button>
      </form>
      <button class="icon-button home-button" id="home" type="button" aria-label="Focus address bar" title="Focus address bar">
        <svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/></svg>
      </button>
    </div>
    <div class="loading-track"><div id="loadingBar" class="loading-track__bar"></div></div>
    <div id="status" class="status" role="status" aria-live="polite" hidden></div>
  </header>

  <main id="frames" class="frames" aria-label="Web page">
    <section class="welcome" id="welcome" aria-label="Proxy search">
      <div class="welcome__content">
        <div class="welcome__mark" aria-hidden="true">U</div>
        <h1>Search the web</h1>
        <p>Enter a website or search for anything.</p>
        <form class="welcome__search" id="welcomeSearch" role="search">
          <input id="welcomeAddress" type="text" placeholder="Search or enter a website address" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search or enter a website address">
          <button type="submit">Search</button>
        </form>
      </div>
    </section>
  </main>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
